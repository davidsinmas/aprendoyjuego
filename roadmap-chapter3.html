<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315c50">
<title>Ludeiko · Capítulo 3</title>
<style>
:root{--bg:#eef3f0;--paper:#fff;--paper2:#f7faf8;--text:#24312d;--muted:#68746f;--line:#d7dfdb;--accent:#315c50;--done:#718078;--tab:56px;--sheet:min(430px,92vw)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}.app{min-height:100vh;overflow:hidden}
.topbar{min-height:82px;padding:16px max(20px,calc((100vw - 1240px)/2));display:flex;align-items:center;background:#ffffffee;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(1.45rem,3vw,2rem);letter-spacing:-.035em}.topbar p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.workspace{width:min(1160px,calc(100% - 36px));margin:auto;padding:28px 0 52px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:26px;min-height:calc(100vh - 165px);padding:clamp(24px,4vw,38px);box-shadow:0 10px 32px #24312d10;position:relative}.paper:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:26px 26px 0 0;background:linear-gradient(90deg,var(--accent),#7da69a,var(--accent))}
.welcome{max-width:780px;margin:8vh auto;text-align:center}.kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:850}.welcome h2{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.08;letter-spacing:-.04em;margin:10px 0}.welcome p{color:var(--muted);line-height:1.65}.welcome button{margin-top:14px;border:0;background:var(--accent);color:#fff;border-radius:13px;padding:12px 18px;font-weight:800}
.stage-head{border-bottom:1px solid var(--line);padding-bottom:22px}.stage-head h2{margin:7px 0 6px;font-size:clamp(1.55rem,4vw,2.2rem);line-height:1.08;letter-spacing:-.035em}.date{color:var(--muted);font-size:.9rem}.description{margin:15px 0 0;color:#4d5a55;line-height:1.6;max-width:900px}.progress{margin:22px 0}.progress-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:7px}.bar{height:8px;background:#e3eae6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}.tasks{display:grid;gap:10px;list-style:none;padding:0;margin:0}.task{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--paper2)}.task input{appearance:none;flex:0 0 21px;width:21px;height:21px;margin:0;border:2px solid #9aaba4;border-radius:6px;background:#fff;position:relative}.task input:checked{background:var(--accent);border-color:var(--accent)}.task input:checked:after{content:"";position:absolute;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);left:6px;top:3px}.task label{font-size:.93rem;line-height:1.48;overflow-wrap:anywhere;cursor:pointer}.task input:checked+label{text-decoration:line-through;color:var(--done)}
.sheet{position:fixed;z-index:20;left:0;top:0;width:var(--sheet);height:100dvh;padding:16px 14px 16px 18px;transform:translateX(0);transition:transform .72s cubic-bezier(.22,.8,.2,1);filter:drop-shadow(15px 0 30px #15231e20)}.sheet.collapsed{transform:translateX(calc(-1 * (var(--sheet) - var(--tab))))}.sheet-inner{height:100%;background:linear-gradient(145deg,#fff,#f5f8f6);border:1px solid #cfdad5;border-radius:0 25px 25px 0;display:flex;flex-direction:column;overflow:hidden}.sheet-head{padding:21px 20px 16px;border-bottom:1px solid var(--line)}.sheet-head h2{margin:0;font-size:1.1rem}.sheet-head p{margin:5px 0 0;color:var(--muted);font-size:.78rem;line-height:1.4}.stage-list{overflow:auto;flex:1;padding:14px 12px 18px;display:grid;gap:8px}.stage{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.stage:hover{border-color:#aebfb8;transform:translateX(2px)}.stage.selected{border-color:var(--accent);box-shadow:0 5px 17px #315c5020}.stage button{width:100%;border:0;background:transparent;text-align:left;color:inherit;padding:13px}.title{display:block;font-weight:800;font-size:.84rem;line-height:1.3}.small-date{display:block;margin-top:4px;color:var(--muted);font-size:.72rem}.desc{display:block;margin-top:5px;color:#596660;font-size:.72rem;line-height:1.35}.closed{color:var(--done);font-size:.59rem;font-weight:900}.tab{position:absolute;right:calc(-1 * var(--tab));top:50%;transform:translateY(-50%);width:var(--tab);min-height:118px;border:1px solid #c7d4ce;border-left:0;border-radius:0 16px 16px 0;background:#f7faf8;color:var(--accent);writing-mode:vertical-rl;font-weight:850}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.nav{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 15px;font-weight:750}.nav.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:820px){.topbar{min-height:70px;padding:13px 16px}.workspace{width:calc(100% - 18px);padding:14px 0 30px}.paper{border-radius:20px;min-height:calc(100vh - 100px);padding:20px}.sheet{--sheet:min(410px,91vw);padding:9px 9px 9px 0}.sheet-inner{border-radius:0 20px 20px 0}.actions{position:sticky;bottom:8px;padding:8px;border:1px solid var(--line);border-radius:13px;background:#fffffff2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div><h1>Planning de Ludeiko · Capítulo 3</h1><p>Avatar, equipamiento y tienda · selecciona una etapa para desplegarla</p></div></header>
<main class="workspace"><section class="paper" id="content"></section></main>
<aside class="sheet" id="sheet" aria-label="Etapas"><div class="sheet-inner"><div class="sheet-head"><h2>Mapa de etapas</h2><p>Al seleccionar una etapa, esta hoja se recoge hacia la izquierda y queda visible su contenido.</p></div><nav class="stage-list" id="stageList"></nav></div><button class="tab" id="tab" type="button">ETAPAS</button></aside>
</div>
<script>
const stages=[
{id:1,title:'Modelo personaje → colección → categoría',date:'13 septiembre',desc:'Definir la estructura de navegación de la tienda.',tasks:['Definir modelo personaje → colección → categoría','Definir tres colecciones por personaje','Definir categorías: armadura, arma, accesorio, etc.','Navegación Avatar → Colección → Categoría','Incluir “Todo” en cada nivel']},
{id:2,title:'Personaje inicial y desbloqueos',date:'13–14 septiembre',desc:'Elección libre del primer personaje y sistema de desbloqueo.',tasks:['Permitir escoger el personaje gratuito inicial','El personaje escogido por el jugador es el gratuito','Mantener el personaje masculino actual como opción','Definir coste en diamantes del segundo personaje y siguientes','Desbloquear personajes con diamantes']},
{id:3,title:'Avatares maestros',date:'14–15 septiembre',desc:'Preparar la base técnica de cada personaje.',tasks:['Crear personaje femenino y avatar maestro','Crear personaje animal y avatar maestro','Mantener postura, escala y origen de cada avatar','Paper-doll independiente para cada personaje']},
{id:4,title:'Equipamiento e inventario',date:'15–16 septiembre',desc:'Separar las piezas por personaje y evitar incompatibilidades.',tasks:['Equipamiento y armaduras independientes por personaje','Impedir piezas incompatibles con otro personaje','Inventario independiente por personaje','Persistir y sincronizar personaje, desbloqueos y equipamiento','Migrar catálogo actual sin perder compras ni progreso']},
{id:5,title:'Filtros y catálogo',date:'16–17 septiembre',desc:'Filtrar los artículos y mostrarlos debajo de las selecciones.',tasks:['Filtrado por personaje y colección','Filtrar artículos por categoría','Mostrar artículos debajo de las selecciones','Mostrar avatares directamente al seleccionar personaje','Mantener filtro “Todo” en cada nivel','Conservar filtro de tienda por nivel']},
{id:6,title:'Economía y presentación',date:'17–18 septiembre',desc:'Revisar precios, rarezas y coherencia visual.',tasks:['Revisar precios','Revisar rarezas','Revisar niveles','Revisar economía de diamantes','Integrar únicamente assets gráficos aprobados y alineados','Actualizar preview del avatar']},
{id:7,title:'Pruebas y cierre',date:'19 septiembre',desc:'Validar la experiencia completa antes de cerrar el capítulo.',tasks:['Mostrar siempre el personaje seleccionado/equipado','Actualizar avatar principal','Probar tienda en móvil','Probar tienda en escritorio','Comprobar persistencia y sincronización','Comprobar que no desaparecen artículos','Cerrar capítulo 3']}
];
let selected=null;const key='ludeiko-roadmap-ch3-v2';let checks=JSON.parse(localStorage.getItem(key)||'{}');
const sheet=document.getElementById('sheet'),content=document.getElementById('content'),list=document.getElementById('stageList');
function renderList(){list.innerHTML=stages.map(s=>`<div class="stage ${selected===s.id?'selected':''}"><button onclick="selectStage(${s.id})"><span class="title">${s.id}. ${s.title}</span><span class="small-date">${s.date}</span><span class="desc">${s.desc}</span></button></div>`).join('')}
function render(){if(selected===null){content.innerHTML='<div class="welcome"><div class="kicker">Capítulo 3</div><h2>Una sola hoja para empezar</h2><p>Selecciona una etapa en la hoja superior. Al hacerlo, la hoja de etapas se desplazará hacia la izquierda y podrás trabajar directamente sobre el contenido de la etapa.</p><button onclick="openStages()">Ver etapas</button></div>';return}const s=stages.find(x=>x.id===selected),done=(checks[selected]||[]).filter(Boolean).length,p=s.tasks.length?Math.round(done/s.tasks.length*100):0;content.innerHTML=`<div class="stage-head"><div class="kicker">Etapa ${s.id} · Capítulo 3</div><h2>${s.title}</h2><div class="date">${s.date}</div><p class="description">${s.desc}</p></div><div class="progress"><div class="progress-meta"><span>Progreso</span><strong>${p}%</strong></div><div class="bar"><i style="width:${p}%"></i></div></div><ul class="tasks">${s.tasks.map((t,i)=>`<li class="task"><input id="t${s.id}-${i}" type="checkbox" ${checks[s.id]?.[i]?'checked':''} onchange="toggle(${s.id},${i},this.checked)"><label for="t${s.id}-${i}">${t}</label></li>`).join('')}</ul><div class="actions"><button class="nav" onclick="prev()" ${s.id===1?'disabled':''}>← Anterior</button><button class="nav primary" onclick="next()" ${s.id===stages.length?'disabled':''}>Siguiente →</button></div>`}
function selectStage(id){selected=id;renderList();render();requestAnimationFrame(()=>sheet.classList.add('collapsed'))}function openStages(){sheet.classList.remove('collapsed')}function toggle(id,i,v){checks[id]=checks[id]||[];checks[id][i]=v;localStorage.setItem(key,JSON.stringify(checks));render()}
function prev(){if(selected>1){selected--;renderList();render();window.scrollTo({top:0,behavior:'smooth'})}}function next(){if(selected<stages.length){selected++;renderList();render();window.scrollTo({top:0,behavior:'smooth'})}}
document.getElementById('tab').onclick=openStages;renderList();render();
</script>
</body></html>
