name: Empaquetar audio Escribe la letra

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-handwriting-audio.yml

permissions:
  contents: write

jobs:
  vendor-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar audio aprobado
        run: |
          mkdir -p assets/audio/narration
          curl --fail --location --retry 3 \
            'https://cdn.creativeclaw.co/u/d65593e1/audio/34505963-7d20-4e1c-8ce2-f505089dc3d2.mp3' \
            --output assets/audio/narration/handwriting-letters.mp3
          test -s assets/audio/narration/handwriting-letters.mp3

      - name: Guardar audio en el repositorio
        run: |
          git config user.name 'Ludeiko Bot'
          git config user.email 'actions@github.com'
          git add assets/audio/narration/handwriting-letters.mp3
          if git diff --cached --quiet; then
            echo 'Audio ya empaquetado.'
            exit 0
          fi
          git commit -m 'Empaquetar audio aprobado de Escribe la letra'
          git push
