name: Mejorar reconocimiento Escribe la letra

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-handwriting-recognition.yml
      - tools/fix_handwriting_recognition.py

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar mejora
        run: |
          python3 tools/fix_handwriting_recognition.py
          node --check js/handwriting.js
          test -s assets/audio/narration/handwriting-letters.mp3
      - name: Publicar V3.17.6
        run: |
          git config user.name "Ludeiko Bot"
          git config user.email "actions@github.com"
          git add js/handwriting.js version.json CHANGELOG.md
          git commit -m "Ludeiko V3.17.6 mejora reconocimiento de escritura"
          git push
