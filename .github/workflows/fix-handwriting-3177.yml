name: Ajustar reconocimiento escritura V3.17.7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-handwriting-3177.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambios
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('js/handwriting.js')
          s=p.read_text(encoding='utf-8')

          old="function templateCanvas(letter,font,mode='fill'){const c=document.createElement('canvas');c.width=180;c.height=180;const x=c.getContext('2d');x.font=`700 132px ${font}`;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';x.strokeStyle='#000';x.lineJoin='round';if(mode==='fill')x.fillText(letter,90,94);else{x.lineWidth=7;x.strokeText(letter,90,94);}return c;}\n  function ensureTemplates(){if(hw.templates)return hw.templates;const fonts=['Arial','Trebuchet MS','Verdana','Avenir Next'];hw.templates={};for(const letter of ALPHABET){const variants=[];for(const font of fonts)for(const mode of ['fill','stroke']){const mask=normalizedMask(templateCanvas(letter,font,mode));if(mask)variants.push(mask);}hw.templates[letter]=variants;}return hw.templates;}"
          new="function templateCanvas(letter,font,mode='fill'){const c=document.createElement('canvas');c.width=180;c.height=180;const x=c.getContext('2d');x.font=`700 132px ${font}`;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';x.strokeStyle='#000';x.lineJoin='round';if(mode==='fill')x.fillText(letter,90,94);else{x.lineWidth=7;x.strokeText(letter,90,94);}return c;}\n  function ensureTemplates(){if(hw.templates)return hw.templates;const fonts=['Arial','Trebuchet MS','Verdana','Avenir Next'];hw.templates={};for(const letter of ALPHABET){const variants=[];const forms=[letter,letter.toLocaleLowerCase('es-ES')];for(const form of forms)for(const font of fonts)for(const mode of ['fill','stroke']){const mask=normalizedMask(templateCanvas(form,font,mode));if(mask)variants.push(mask);}hw.templates[letter]=variants;}return hw.templates;}"
          if old not in s: raise SystemExit('Bloque plantillas no encontrado')
          s=s.replace(old,new)

          old2="function acceptanceLimits(){const level=Number(state.level?.level||1);if(level<=6)return{maxDistance:3.85,strongDistance:2.75,ambiguity:.55,maxRank:3};if(level<=16)return{maxDistance:3.55,strongDistance:2.5,ambiguity:.42,maxRank:2};return{maxDistance:3.25,strongDistance:2.3,ambiguity:.3,maxRank:2};}\n  function isExpectedLetter(result,expected){if(!result?.ranking?.length)return false;const limits=acceptanceLimits(),rank=result.ranking.findIndex(item=>item.letter===expected);if(rank<0||rank>=limits.maxRank)return false;const target=result.ranking[rank],best=result.ranking[0];if(!Number.isFinite(target.distance)||target.distance>limits.maxDistance)return false;if(target.distance<=limits.strongDistance)return true;const delta=target.distance-(Number.isFinite(best?.distance)?best.distance:target.distance);return delta<=limits.ambiguity;}"
          new2="function acceptanceLimits(){const level=Number(state.level?.level||1);if(level<=6)return{maxDistance:4.35,strongDistance:3.15,maxRank:5};if(level<=16)return{maxDistance:4.05,strongDistance:2.95,maxRank:4};return{maxDistance:3.7,strongDistance:2.7,maxRank:3};}\n  function isExpectedLetter(result,expected){if(!result?.ranking?.length)return false;const limits=acceptanceLimits(),rank=result.ranking.findIndex(item=>item.letter===expected);if(rank<0)return false;const target=result.ranking[rank];if(!Number.isFinite(target.distance)||target.distance>limits.maxDistance)return false;if(target.distance<=limits.strongDistance)return true;return rank<limits.maxRank;}"
          if old2 not in s: raise SystemExit('Bloque aceptación no encontrado')
          s=s.replace(old2,new2)

          old3="function checkHandwriting(){if(state.locked||!hw.hasInk||!hw.canvas)return;state.locked=true;toggleCheck(false);hw.attempts++;const result=recognize(hw.canvas),expected=hw.current,accepted=isExpectedLetter(result,expected);const msg=document.getElementById('handwritingMessage'),confidence=document.getElementById('handwritingConfidence');if(accepted){if(hw.attempts===1)state.hits++;rewardProgressCorrect();if(msg){msg.textContent=hw.attempts===1?'¡Muy bien!':'¡Eso es!';msg.className='handwriting-message ok';}if(confidence)confidence.textContent='';morphToTypedLetter(expected);window.GameSound?.play('correct');setTimeout(handwritingQuestion,1350);}else{playChime('bad');if(msg){msg.textContent='Aún no parece la letra que has escuchado. Prueba otra vez.';msg.className='handwriting-message bad';}if(confidence)confidence.textContent='Puedes borrarla o escuchar la letra de nuevo.';state.locked=false;toggleCheck(true);}}"
          new3="function checkHandwriting(){if(state.locked||!hw.hasInk||!hw.canvas)return;state.locked=true;toggleCheck(false);hw.attempts++;const result=recognize(hw.canvas),expected=hw.current,accepted=isExpectedLetter(result,expected);const msg=document.getElementById('handwritingMessage'),confidence=document.getElementById('handwritingConfidence');if(accepted){if(hw.attempts===1)state.hits++;rewardProgressCorrect();if(msg){msg.textContent=hw.attempts===1?'¡Muy bien!':'¡Eso es!';msg.className='handwriting-message ok';}if(confidence)confidence.textContent='';morphToTypedLetter(expected);window.GameSound?.play('correct');setTimeout(handwritingQuestion,1100);}else if(hw.attempts>=2){playChime('bad');if(msg){msg.textContent='Vamos con la siguiente.';msg.className='handwriting-message bad';}if(confidence)confidence.textContent='';setTimeout(handwritingQuestion,900);}else{playChime('bad');if(msg){msg.textContent='Prueba una vez más.';msg.className='handwriting-message bad';}if(confidence)confidence.textContent='Puedes escribirla en mayúscula o minúscula.';state.locked=false;toggleCheck(true);}}"
          if old3 not in s: raise SystemExit('Bloque comprobación no encontrado')
          s=s.replace(old3,new3)

          s=s.replace('Escribe una sola letra dentro del recuadro.','Escribe una letra en mayúscula o minúscula.')
          p.write_text(s,encoding='utf-8')

          vp=Path('version.json'); data=json.loads(vp.read_text(encoding='utf-8')); data.update({'version':'3.17.7','name':'Escritura mayúsculas y minúsculas','date':'2026-09-16'}); vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          cp=Path('CHANGELOG.md')
          if cp.exists():
              c=cp.read_text(encoding='utf-8')
              if '## V3.17.7' not in c:
                  entry='## V3.17.7 — 2026-09-16\n- Escribe la letra acepta mayúsculas y minúsculas, mejora la tolerancia del reconocimiento infantil y limita cada letra a dos intentos antes de continuar.\n\n'
                  first,rest=c.split('\n',1) if '\n' in c else (c,'')
                  cp.write_text(first+'\n\n'+entry+rest.lstrip('\n'),encoding='utf-8')
          PY
          node --check js/handwriting.js
      - name: Publicar
        run: |
          git config user.name 'Ludeiko Bot'
          git config user.email 'actions@github.com'
          git add js/handwriting.js version.json CHANGELOG.md
          git commit -m 'Ludeiko V3.17.7 mejora escritura infantil'
          git push
