name: Deploy Aprendo Jugando to OVH

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'version.json'
      - 'roadmap.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/deploy-ovh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aprendoyjuego-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validar versión y recursos
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f version.json
          test -d assets
          test -d css
          test -d js
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          value = json.loads(Path('version.json').read_text(encoding='utf-8')).get('version', '')
          if not re.fullmatch(r'\d+\.\d+\.\d+', value):
              raise SystemExit('version.json no contiene una versión válida')
          print('Versión a desplegar:', value)
          PY
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Comprobar configuración OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
          OVH_REMOTE_DIR: ludeiko
        run: |
          set -euo pipefail
          test -n "$OVH_SFTP_HOST" || { echo 'Falta OVH_SFTP_HOST'; exit 1; }
          test -n "$OVH_SFTP_USER" || { echo 'Falta OVH_SFTP_USER'; exit 1; }
          test -n "$OVH_SFTP_PASSWORD" || { echo 'Falta OVH_SFTP_PASSWORD'; exit 1; }
          [[ "$OVH_SFTP_PORT" =~ ^[0-9]+$ ]] || { echo 'OVH_SFTP_PORT no es numérico'; exit 1; }
          [[ "$OVH_REMOTE_DIR" =~ ^\.?/?ludeiko/?$ ]] || { echo 'OVH_REMOTE_DIR debe apuntar únicamente a ludeiko'; exit 1; }

      - name: Instalar cliente SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-paramiko

      - name: Registrar clave del servidor OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p "$OVH_SFTP_PORT" -H "$OVH_SFTP_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Desplegar web estática en ./ludeiko
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
          OVH_REMOTE_DIR: ludeiko
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          import posixpath
          import subprocess
          from pathlib import Path, PurePosixPath
          import paramiko

          host = os.environ['OVH_SFTP_HOST']
          user = os.environ['OVH_SFTP_USER']
          password = os.environ['OVH_SFTP_PASSWORD']
          port = int(os.environ.get('OVH_SFTP_PORT', '22'))
          remote_dir = os.environ.get('OVH_REMOTE_DIR', 'ludeiko').strip('/').removeprefix('./')

          # El código es ligero y se publica completo para evitar estados mixtos.
          files = []
          for root in (Path('css'), Path('js')):
              files.extend(path for path in sorted(root.rglob('*')) if path.is_file())
          for path in (Path('index.html'), Path('roadmap.html'), Path('.nojekyll')):
              if path.exists():
                  files.append(path)

          # Los assets pueden ser grandes: solo se envían cuando cambian en este push.
          try:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', 'HEAD^', 'HEAD', '--', 'assets'],
                  text=True,
              ).splitlines()
          except Exception:
              changed = []
          for name in changed:
              path = Path(name)
              if path.is_file():
                  files.append(path)

          # version.json siempre al final: actúa como marcador de publicación completa.
          version_file = Path('version.json')

          client = paramiko.SSHClient()
          client.load_system_host_keys()
          client.set_missing_host_key_policy(paramiko.RejectPolicy())
          client.connect(
              hostname=host,
              port=port,
              username=user,
              password=password,
              timeout=20,
              banner_timeout=20,
              auth_timeout=20,
          )
          sftp = client.open_sftp()
          sftp.get_channel().settimeout(30)

          try:
              sftp.chdir(remote_dir)
          except OSError as exc:
              raise SystemExit(f'No existe o no es accesible la carpeta remota {remote_dir!r}: {exc}')

          def ensure_dir(relative_parent):
              current = ''
              for part in PurePosixPath(relative_parent).parts:
                  if part in ('', '.'):
                      continue
                  current = posixpath.join(current, part)
                  try:
                      sftp.stat(current)
                  except OSError:
                      sftp.mkdir(current)

          def upload(path):
              remote = path.as_posix()
              ensure_dir(PurePosixPath(remote).parent)
              print(f'Publicando: {remote}', flush=True)
              sftp.put(str(path), remote, confirm=True)

          try:
              # Sin duplicados, manteniendo orden estable.
              seen = set()
              for path in files:
                  key = path.as_posix()
                  if key in seen:
                      continue
                  seen.add(key)
                  upload(path)
              upload(version_file)
          finally:
              sftp.close()
              client.close()
          PY

      - name: Verificar versión publicada
        shell: bash
        env:
          PUBLIC_URL: https://ludeiko.calisoftprojects.com
        run: |
          set -euo pipefail
          EXPECTED="$(python3 -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")"
          URL="${PUBLIC_URL%/}/version.json?ts=$(date +%s)"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "$URL" -o /tmp/remote-version.json; then
              REMOTE="$(python3 -c "import json; print(json.load(open('/tmp/remote-version.json', encoding='utf-8'))['version'])")"
              if [ "$REMOTE" = "$EXPECTED" ]; then
                echo "OVH actualizado correctamente a V$REMOTE"
                exit 0
              fi
              echo "Intento $attempt: OVH devuelve V$REMOTE; esperado V$EXPECTED"
            fi
            sleep 3
          done
          echo 'La verificación pública no coincide con la versión desplegada.'
          exit 1
