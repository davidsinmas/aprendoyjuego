name: Deploy Aprendo Jugando to OVH

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'version.json'
      - 'roadmap.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/deploy-ovh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aprendoyjuego-ovh-stable
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validar versión y recursos
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f version.json
          test -d css
          test -d js
          test -s assets/audio/narration/handwriting-letters.mp3
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          value = json.loads(Path('version.json').read_text(encoding='utf-8')).get('version', '')
          if not re.fullmatch(r'\d+\.\d+\.\d+', value):
              raise SystemExit('version.json no contiene una versión válida')
          print('Versión a desplegar:', value)
          PY
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Comprobar configuración OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$OVH_SFTP_HOST"
          test -n "$OVH_SFTP_USER"
          test -n "$OVH_SFTP_PASSWORD"
          [[ "$OVH_SFTP_PORT" =~ ^[0-9]+$ ]]

      - name: Instalar cliente SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Registrar clave del servidor OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p "$OVH_SFTP_PORT" -H "$OVH_SFTP_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preparar despliegue
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "cd ludeiko"

            find css js -type d -print | sort | while IFS= read -r dir; do
              printf -- '-mkdir "%s"\n' "$dir"
            done

            find css js -type f -print | sort | while IFS= read -r file; do
              printf 'put "%s" "%s"\n' "$file" "$file"
            done

            for file in index.html roadmap.html .nojekyll; do
              if [ -f "$file" ]; then
                printf 'put "%s" "%s"\n' "$file" "$file"
              fi
            done

            if git rev-parse HEAD^ >/dev/null 2>&1; then
              git diff --name-only HEAD^ HEAD -- assets | while IFS= read -r file; do
                [ -f "$file" ] || continue
                parent="$(dirname "$file")"
                current=""
                IFS='/' read -ra parts <<< "$parent"
                for part in "${parts[@]}"; do
                  [ -n "$part" ] || continue
                  current="${current:+$current/}$part"
                  printf -- '-mkdir "%s"\n' "$current"
                done
                printf 'put "%s" "%s"\n' "$file" "$file"
              done
            fi

            # Recurso crítico de Escucha y escribe: siempre debe existir en OVH.
            echo '-mkdir "assets"'
            echo '-mkdir "assets/audio"'
            echo '-mkdir "assets/audio/narration"'
            echo 'put "assets/audio/narration/handwriting-letters.mp3" "assets/audio/narration/handwriting-letters.mp3"'

            # version.json se publica al final y actúa como marcador de despliegue completo.
            echo 'put "version.json" "version.json"'
            echo "bye"
          } > /tmp/ludeiko.sftp

      - name: Publicar en OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          timeout 120s sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=yes \
            -oConnectTimeout=20 \
            -P "$OVH_SFTP_PORT" \
            -b /tmp/ludeiko.sftp \
            "$OVH_SFTP_USER@$OVH_SFTP_HOST"

      - name: Verificar versión y audio publicados
        shell: bash
        env:
          PUBLIC_URL: https://ludeiko.calisoftprojects.com
        run: |
          set -euo pipefail
          EXPECTED="$(python3 -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")"
          AUDIO_URL="${PUBLIC_URL%/}/assets/audio/narration/handwriting-letters.mp3?ts=$(date +%s)"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' --range 0-1023 "$AUDIO_URL" -o /tmp/handwriting-audio-check
          test -s /tmp/handwriting-audio-check
          echo "Audio de Escucha y escribe accesible en OVH"

          for attempt in 1 2 3 4 5; do
            URL="${PUBLIC_URL%/}/version.json?ts=$(date +%s)-$attempt"
            if curl --fail --silent --show-error --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "$URL" -o /tmp/remote-version.json; then
              REMOTE="$(python3 -c "import json; print(json.load(open('/tmp/remote-version.json', encoding='utf-8'))['version'])")"
              if [ "$REMOTE" = "$EXPECTED" ]; then
                echo "OVH actualizado correctamente a V$REMOTE"
                exit 0
              fi
              echo "Intento $attempt: OVH devuelve V$REMOTE; esperado V$EXPECTED"
            fi
            sleep 3
          done
          echo 'La verificación pública no coincide con la versión desplegada.'
          exit 1
