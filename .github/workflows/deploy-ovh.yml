name: OVH preflight Aprendo Jugando

on:
  push:
    branches:
      - test/ovh-preflight
    paths:
      - '.github/workflows/deploy-ovh.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Instalar cliente SFTP
        run: sudo apt-get update && sudo apt-get install -y python3-paramiko

      - name: Registrar clave OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$OVH_SFTP_HOST"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p "$OVH_SFTP_PORT" -H "$OVH_SFTP_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Probar acceso SFTP sin escribir
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os
          import stat
          import paramiko

          host = os.environ['OVH_SFTP_HOST']
          user = os.environ['OVH_SFTP_USER']
          password = os.environ['OVH_SFTP_PASSWORD']
          port = int(os.environ.get('OVH_SFTP_PORT', '22'))

          client = paramiko.SSHClient()
          client.load_system_host_keys()
          client.set_missing_host_key_policy(paramiko.RejectPolicy())
          client.connect(
              hostname=host,
              port=port,
              username=user,
              password=password,
              allow_agent=False,
              look_for_keys=False,
              timeout=20,
              banner_timeout=20,
              auth_timeout=20,
          )
          sftp = client.open_sftp()
          home = sftp.normalize('.')
          names = {entry.filename: entry for entry in sftp.listdir_attr('.')}
          if 'ludeiko' not in names:
              raise SystemExit(f"Autenticación correcta, pero no existe 'ludeiko' en {home}")
          if not stat.S_ISDIR(names['ludeiko'].st_mode):
              raise SystemExit("'ludeiko' existe pero no es una carpeta")
          print('OK: autenticación SFTP correcta y carpeta ludeiko accesible en modo lectura')
          sftp.close()
          client.close()
          PY
