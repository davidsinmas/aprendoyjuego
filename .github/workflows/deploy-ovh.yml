name: Deploy Aprendo Jugando to OVH

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'version.json'
      - 'roadmap.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/deploy-ovh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aprendoyjuego-ovh-stable
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validar versión y recursos
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f version.json
          test -d css
          test -d js
          test -s assets/audio/narration/handwriting-letters.mp3
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          value = json.loads(Path('version.json').read_text(encoding='utf-8')).get('version', '')
          if not re.fullmatch(r'\d+\.\d+\.\d+', value):
              raise SystemExit('version.json no contiene una versión válida')
          print('Versión a desplegar:', value)
          PY
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Comprobar configuración OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$OVH_SFTP_HOST"
          test -n "$OVH_SFTP_USER"
          test -n "$OVH_SFTP_PASSWORD"
          [[ "$OVH_SFTP_PORT" =~ ^[0-9]+$ ]]

      - name: Instalar cliente SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Registrar clave del servidor OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p "$OVH_SFTP_PORT" -H "$OVH_SFTP_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preparar despliegue
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "cd ludeiko"

            find css js -type d -print | sort | while IFS= read -r dir; do
              printf -- '-mkdir "%s"\n' "$dir"
            done

            find css js -type f -print | sort | while IFS= read -r file; do
              printf 'put "%s" "%s"\n' "$file" "$file"
            done

            for file in index.html roadmap.html .nojekyll; do
              if [ -f "$file" ]; then
                printf 'put "%s" "%s"\n' "$file" "$file"
              fi
            done

            if git rev-parse HEAD^ >/dev/null 2>&1; then
              git diff --name-only HEAD^ HEAD -- assets | while IFS= read -r file; do
                [ -f "$file" ] || continue
                parent="$(dirname "$file")"
                current=""
                IFS='/' read -ra parts <<< "$parent"
                for part in "${parts[@]}"; do
                  [ -n "$part" ] || continue
                  current="${current:+$current/}$part"
                  printf -- '-mkdir "%s"\n' "$current"
                done
                printf 'put "%s" "%s"\n' "$file" "$file"
              done
            fi

            echo '-mkdir "assets"'
            echo '-mkdir "assets/audio"'
            echo '-mkdir "assets/audio/narration"'
            echo 'put "assets/audio/narration/handwriting-letters.mp3" "assets/audio/narration/handwriting-letters.mp3"'
            echo 'put "version.json" "version.json"'
            echo "bye"
          } > /tmp/ludeiko.sftp

      - name: Publicar en OVH
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
        run: |
          set -euo pipefail
          timeout 120s sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=yes \
            -oConnectTimeout=20 \
            -P "$OVH_SFTP_PORT" \
            -b /tmp/ludeiko.sftp \
            "$OVH_SFTP_USER@$OVH_SFTP_HOST"

      - name: Verificar publicación crítica
        shell: bash
        env:
          PUBLIC_URL: https://ludeiko.calisoftprojects.com
        run: |
          set -euo pipefail
          EXPECTED="$(python3 -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")"
          TS="$(date +%s)"

          AUDIO_URL="${PUBLIC_URL%/}/assets/audio/narration/handwriting-letters.mp3?ts=$TS"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' --range 0-1023 "$AUDIO_URL" -o /tmp/handwriting-audio-check
          test -s /tmp/handwriting-audio-check
          echo "Audio de Escucha y escribe accesible en OVH"

          JS_URL="${PUBLIC_URL%/}/js/handwriting.js?ts=$TS"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' "$JS_URL" -o /tmp/public-handwriting.js
          node --check /tmp/public-handwriting.js
          if ! cmp -s js/handwriting.js /tmp/public-handwriting.js; then
            echo 'OVH no está sirviendo el handwriting.js de este despliegue.'
            echo "Local:  $(sha256sum js/handwriting.js | cut -d' ' -f1)"
            echo "Público: $(sha256sum /tmp/public-handwriting.js | cut -d' ' -f1)"
            exit 1
          fi
          echo "handwriting.js público coincide byte a byte con el repositorio"

          VERSION_OK=0
          for attempt in 1 2 3 4 5; do
            URL="${PUBLIC_URL%/}/version.json?ts=$TS-$attempt"
            if curl --fail --silent --show-error --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "$URL" -o /tmp/remote-version.json; then
              REMOTE="$(python3 -c "import json; print(json.load(open('/tmp/remote-version.json', encoding='utf-8'))['version'])")"
              if [ "$REMOTE" = "$EXPECTED" ]; then
                echo "OVH actualizado correctamente a V$REMOTE"
                VERSION_OK=1
                break
              fi
              echo "Intento $attempt: OVH devuelve V$REMOTE; esperado V$EXPECTED"
            fi
            sleep 3
          done
          if [ "$VERSION_OK" -ne 1 ]; then
            echo 'La verificación pública no coincide con la versión desplegada.'
            exit 1
          fi

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No hay navegador Chromium disponible para la prueba funcional.'
            exit 1
          fi
          SMOKE_URL="${PUBLIC_URL%/}/?handwriting-smoke=1&v=${EXPECTED}&ts=$TS"
          set +e
          timeout 60s "$BROWSER" --headless=new --no-sandbox --mute-audio --disable-gpu --disable-dev-shm-usage --disable-extensions --disable-sync --user-data-dir=/tmp/ludeiko-chrome --virtual-time-budget=8000 --dump-dom "$SMOKE_URL" > /tmp/handwriting-smoke.html
          CHROME_STATUS=$?
          set -e
          echo "Estado Chromium: $CHROME_STATUS"
          echo 'Resultado diagnóstico:'
          grep -o 'data-handwriting-smoke="[^"]*"' /tmp/handwriting-smoke.html || true
          grep -o '<meta name="ludeiko-handwriting-smoke"[^>]*>' /tmp/handwriting-smoke.html || true
          if [ "$CHROME_STATUS" -ne 0 ]; then
            echo 'Chromium no pudo completar la prueba pública.'
            exit 1
          fi
          grep -q 'data-handwriting-smoke="pass"' /tmp/handwriting-smoke.html
          grep -q 'content="I:pass,O:pass,A:pass,M:pass,S:pass,B:pass,R:pass"' /tmp/handwriting-smoke.html
          echo 'Reconocimiento público validado: I, O, A, M, S, B y R (correcta, aproximada, incorrecta y garabato)'

          python3 -m pip install --quiet --disable-pip-version-check selenium
          EXPECTED="$EXPECTED" PUBLIC_URL="$PUBLIC_URL" python3 - <<'PY'
          import math
          import os
          import shutil
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          public_url = os.environ['PUBLIC_URL'].rstrip('/')
          expected_version = os.environ['EXPECTED']
          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
          chromedriver = shutil.which('chromedriver')
          if not chrome:
              raise SystemExit('Chromium no disponible para la prueba de interacción')

          options = Options()
          options.binary_location = chrome
          for arg in ('--headless=new','--no-sandbox','--mute-audio','--disable-gpu','--disable-dev-shm-usage','--disable-extensions','--disable-sync','--window-size=390,844'):
              options.add_argument(arg)
          service = Service(chromedriver) if chromedriver else Service()
          driver = webdriver.Chrome(service=service, options=options)
          wait = WebDriverWait(driver, 12)

          audit_script = r'''
          (() => {
            window.__ludeikoAudioAudit = {contexts: 0, starts: 0};
            const Native = window.AudioContext || window.webkitAudioContext;
            if (Native) {
              const Wrapped = new Proxy(Native, {
                construct(target, args) {
                  window.__ludeikoAudioAudit.contexts++;
                  return Reflect.construct(target, args);
                }
              });
              try { Object.defineProperty(window, 'AudioContext', {configurable:true, writable:true, value:Wrapped}); } catch(e) {}
              try { Object.defineProperty(window, 'webkitAudioContext', {configurable:true, writable:true, value:Wrapped}); } catch(e) {}
            }
            if (window.AudioBufferSourceNode && AudioBufferSourceNode.prototype.start) {
              const nativeStart = AudioBufferSourceNode.prototype.start;
              AudioBufferSourceNode.prototype.start = function(...args) {
                window.__ludeikoAudioAudit.starts++;
                return nativeStart.apply(this, args);
              };
            }
          })();
          '''
          driver.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument', {'source': audit_script})

          def draw(points, pointer_type='touch', pointer_id=41):
              driver.execute_script(r'''
                const canvas=arguments[0], points=arguments[1], pointerType=arguments[2], pointerId=arguments[3];
                const rect=canvas.getBoundingClientRect();
                const fire=(type,p,buttons)=>canvas.dispatchEvent(new PointerEvent(type,{
                  bubbles:true,cancelable:true,pointerId,pointerType,isPrimary:true,buttons,
                  clientX:rect.left+p[0]*rect.width,clientY:rect.top+p[1]*rect.height
                }));
                fire('pointerdown',points[0],1);
                for(let i=1;i<points.length;i++) fire('pointermove',points[i],1);
                fire('pointerup',points[points.length-1],0);
              ''', canvas, points, pointer_type, pointer_id)

          try:
              driver.get(f'{public_url}/?v={expected_version}&interaction-smoke=1')
              wait.until(lambda d: d.execute_script("return typeof startHandwriting === 'function'"))
              contexts_before = driver.execute_script('return window.__ludeikoAudioAudit?.contexts ?? -1')
              if contexts_before != 0:
                  raise AssertionError(f'AudioContext creado antes del gesto: {contexts_before}')

              driver.execute_script(r'''
                const button=document.createElement('button');
                button.id='handwritingSmokeStart';
                button.textContent='start';
                button.onclick=()=>startHandwriting({id:'handwritingSmoke',level:1,letters:'I',name:'Smoke'});
                document.body.appendChild(button);
              ''')
              driver.find_element(By.ID, 'handwritingSmokeStart').click()

              canvas = wait.until(lambda d: d.find_element(By.ID, 'handwritingCanvas'))
              check = driver.find_element(By.ID, 'handwritingCheck')
              clear = driver.find_element(By.ID, 'handwritingClear')
              listen = driver.find_element(By.ID, 'handwritingListen')

              touch_action = driver.execute_script("return getComputedStyle(arguments[0]).touchAction", canvas)
              if touch_action != 'none':
                  raise AssertionError(f'touch-action inesperado: {touch_action}')
              wait.until(lambda d: d.execute_script('return window.__ludeikoAudioAudit.contexts >= 1'))
              wait.until(lambda d: d.execute_script('return window.__ludeikoAudioAudit.starts >= 1'))

              starts_before = driver.execute_script('return window.__ludeikoAudioAudit.starts')
              listen.click()
              wait.until(lambda d: d.execute_script('return window.__ludeikoAudioAudit.starts') > starts_before)

              circle = []
              for i in range(33):
                  angle = 2 * math.pi * i / 32
                  circle.append([0.5 + 0.26 * math.cos(angle), 0.5 + 0.34 * math.sin(angle)])
              draw(circle, 'touch', 51)
              if check.get_property('disabled'):
                  raise AssertionError('Comprobar no se habilitó tras el trazo táctil')
              check.click()
              wait.until(lambda d: 'bad' in d.find_element(By.ID, 'handwritingMessage').get_attribute('class'))
              if check.get_property('disabled'):
                  raise AssertionError('Comprobar quedó bloqueado después de una letra incorrecta')

              clear.click()
              if not check.get_property('disabled'):
                  raise AssertionError('Borrar no deshabilitó Comprobar')

              line = [[0.5, 0.18 + 0.64 * i / 18] for i in range(19)]
              draw(line, 'touch', 52)
              if check.get_property('disabled'):
                  raise AssertionError('Comprobar no se habilitó para la I')
              check.click()
              wait.until(lambda d: 'ok' in d.find_element(By.ID, 'handwritingMessage').get_attribute('class'))

              clear_test = driver.execute_script(r'''
                const c=arguments[0];
                const before=document.documentElement.scrollTop||document.body.scrollTop||0;
                return {before, after:document.documentElement.scrollTop||document.body.scrollTop||0};
              ''', canvas)
              if clear_test['before'] != clear_test['after']:
                  raise AssertionError('El trazo táctil desplazó la página')

              print('Interacción pública validada: viewport móvil 390x844, canvas táctil, borrar, comprobar, error, acierto y altavoz/WebAudio')
          finally:
              driver.quit()
          PY
