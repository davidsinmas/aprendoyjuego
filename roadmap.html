<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315c50">
<title>Planning · Ludeiko</title>
<style>
:root{--bg:#eef3f0;--surface:#fff;--surface-2:#f7faf8;--text:#24312d;--muted:#68746f;--line:#d7dfdb;--accent:#315c50;--accent-2:#477568;--done:#718078;--late:#a64b3c;--shadow:0 18px 45px #24312d1c;--sheet-w:min(390px,92vw);--tab-w:58px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;position:relative;overflow:hidden}
.topbar{min-height:86px;padding:18px max(20px,calc((100vw - 1220px)/2)) 14px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#ffffffd9;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:relative;z-index:2}
.brand h1{font-size:clamp(1.45rem,3vw,2rem);margin:0;letter-spacing:-.03em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.menu-trigger{display:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:700}
.workspace{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:28px 0 54px;min-height:calc(100vh - 86px)}
.content{min-width:0;transition:padding-left .65s cubic-bezier(.22,.8,.2,1)}
.content-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 28px #24312d0c;min-height:650px;padding:clamp(22px,4vw,36px);position:relative;overflow:hidden}
.content-card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--accent),#79a497,var(--accent));opacity:.9}
.stage-head{display:grid;grid-template-columns:1fr auto;gap:18px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}
.kicker{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:850;color:var(--accent)}
.stage-head h2{margin:6px 0 7px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.08;letter-spacing:-.035em}
.stage-date{color:var(--muted);font-size:.92rem}
.stage-description{margin:16px 0 0;max-width:760px;color:#4d5a55;line-height:1.6}
.stage-state{align-self:start;border:1px solid var(--line);background:var(--surface-2);border-radius:15px;padding:11px 13px;text-align:center;min-width:96px}
.stage-state strong{display:block;font-size:1.2rem}.stage-state span{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-top:2px}
.progress-wrap{margin-bottom:22px}.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted);margin-bottom:7px}.progress{height:8px;border-radius:999px;background:#e3eae6;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .35s ease}
.task-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.task{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);transition:transform .18s ease,border-color .18s ease,background .18s ease}.task:hover{transform:translateY(-1px);border-color:#b7c7c0;background:#fff}.task input{appearance:none;width:21px;height:21px;flex:0 0 auto;margin:0;border:2px solid #9aaba4;border-radius:6px;background:#fff;position:relative;cursor:pointer}.task input:checked{background:var(--accent);border-color:var(--accent)}.task input:checked:after{content:"";position:absolute;width:5px;height:10px;border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg);left:6px;top:3px}.task label{font-size:.9rem;line-height:1.42;cursor:pointer}.task input:checked+label{text-decoration:line-through;color:var(--done)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px}.nav-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:750}.nav-btn:hover{border-color:#a8b9b2;background:var(--surface-2)}.nav-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.nav-btn:disabled{opacity:.4;cursor:not-allowed}
.sheet{position:fixed;z-index:10;left:0;top:0;width:var(--sheet-w);height:100dvh;padding:18px 16px 18px 18px;transform:translateX(0);transition:transform .68s cubic-bezier(.22,.8,.2,1);filter:drop-shadow(16px 0 28px #18221e1c);pointer-events:auto}.sheet-inner{height:100%;background:linear-gradient(145deg,#fff 0%,#f5f8f6 100%);border:1px solid #cfdad5;border-radius:0 24px 24px 0;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}.sheet:after{content:"";position:absolute;top:18px;bottom:18px;right:0;width:3px;border-radius:3px;background:#c7d4ce}
.sheet.closed{transform:translateX(calc(-1 * (var(--sheet-w) - var(--tab-w))))}.sheet-tab{position:absolute;right:-58px;top:50%;transform:translateY(-50%);width:58px;min-height:118px;border:1px solid #c7d4ce;border-left:0;border-radius:0 16px 16px 0;background:#f7faf8;color:var(--accent);box-shadow:10px 8px 25px #24312d14;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-weight:850;letter-spacing:.05em}.sheet-tab span{font-size:.72rem}.sheet-header{padding:22px 20px 17px;border-bottom:1px solid var(--line)}.sheet-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.sheet-header h2{margin:0;font-size:1.08rem}.sheet-header p{margin:5px 0 0;color:var(--muted);font-size:.78rem;line-height:1.4}.close-sheet{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 4px}.sheet-summary{padding:13px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary-item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px}.summary-item strong{display:block;font-size:1rem}.summary-item span{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;font-weight:800;letter-spacing:.05em;margin-top:2px}.stage-list{overflow:auto;padding:14px 12px 18px;display:grid;gap:8px;overscroll-behavior:contain}.stage{border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s}.stage button{appearance:none;width:100%;border:0;background:transparent;text-align:left;color:inherit;padding:12px 13px;display:block}.stage:hover{transform:translateX(2px);border-color:#b4c5be}.stage.selected{border-color:var(--accent);box-shadow:0 5px 17px #315c5020;transform:translateX(5px)}.stage-title{display:block;font-weight:800;font-size:.83rem;line-height:1.3}.stage-date{display:block;margin-top:4px;color:var(--muted);font-size:.72rem}.stage-desc{display:block;margin-top:5px;color:#596660;font-size:.72rem;line-height:1.35}.status{display:inline-block;margin-left:6px;color:var(--done);font-size:.6rem;font-weight:900;letter-spacing:.06em}.stage.done .stage-title,.stage.done .stage-date,.stage.done .stage-desc{text-decoration:line-through;color:var(--done)}.stage.late{border-color:#a64b3c73}.stage.late .stage-date{color:var(--late);font-weight:700}
.backdrop{position:fixed;inset:0;background:#15231e44;z-index:9;opacity:0;pointer-events:none;transition:opacity .45s ease}.backdrop.visible{opacity:1;pointer-events:auto}
.hint{margin:0 0 16px;color:var(--muted);font-size:.8rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:820px){:root{--sheet-w:min(400px,91vw);--tab-w:54px}.topbar{min-height:72px;padding:14px 16px}.menu-trigger{display:block}.workspace{width:calc(100% - 20px);padding:14px 0 32px;min-height:calc(100vh - 72px)}.content-card{min-height:calc(100vh - 110px);border-radius:20px;padding:20px}.sheet{padding:10px 10px 10px 0}.sheet-inner{border-radius:0 20px 20px 0}.sheet:after{top:10px;bottom:10px}.sheet-tab{min-height:104px}.backdrop.visible{display:block}.task-list{grid-template-columns:1fr}.stage-head{grid-template-columns:1fr}.stage-state{justify-self:start}.actions{position:sticky;bottom:8px;background:#ffffffec;border:1px solid var(--line);border-radius:14px;padding:8px;backdrop-filter:blur(8px)}}
@media(max-width:520px){.brand p{display:none}.content-card{padding:18px}.stage-head h2{font-size:1.45rem}.task{padding:12px}.sheet-header{padding:18px 16px 14px}.sheet-summary{padding:11px 16px}.stage-list{padding:12px 9px 16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar"><div class="brand"><h1>Planning de Ludeiko</h1><p>Hoja de ruta interactiva · selecciona una etapa para trabajar sobre ella</p></div><button class="menu-trigger" id="openMenu" type="button">Etapas</button></header>
<div class="workspace"><main class="content"><section class="content-card" id="details" aria-live="polite"></section></main></div>
<div class="backdrop" id="backdrop"></div>
<aside class="sheet" id="sheet" aria-label="Menú de etapas"><div class="sheet-inner">
<div class="sheet-header"><div class="sheet-header-row"><div><h2>Mapa de etapas</h2><p>Elige una etapa. La lámina se retira para dejar todo el espacio al trabajo.</p></div><button class="close-sheet" id="closeMenu" type="button" aria-label="Ocultar menú">×</button></div></div>
<div class="sheet-summary"><div class="summary-item"><strong id="stageCount">18</strong><span>Etapas</span></div><div class="summary-item"><strong id="doneCount">2</strong><span>Cerradas</span></div></div>
<nav class="stage-list" id="stageList" aria-label="Etapas del planning"></nav>
</div><button class="sheet-tab" id="sheetTab" type="button" aria-label="Mostrar menú de etapas"><span>ETAPAS</span></button></aside>
</div>
<script>
const stages=[
{id:1,title:'Cerrar y estabilizar el acceso de familias',date:'5–7 septiembre 2026',done:true,desc:'Registro, confirmación, acceso y modo Padres.',detail:'Registro, confirmación, inicio de sesión y modo Padres. Safari y el PIN están validados. SMTP externo queda aplazado.',tasks:['Registro de familias','Confirmación y retorno correcto desde el correo','Inicio y cierre de sesión','Modo Padres','Teclado/PIN en Safari','SMTP externo aplazado a etapa 9']},
{id:2,title:'Consolidar la sincronización entre dispositivos',date:'8–12 septiembre 2026',done:true,desc:'Progreso y cambios online/offline entre dispositivos.',detail:'La sincronización se ha validado con la misma cuenta en dos dispositivos, incluyendo recuperación tras trabajar sin conexión.',tasks:['Misma cuenta en dos dispositivos','Mismo progreso en ambos','Cambio en A visible en B','Cambio offline sincronizado al recuperar internet','Persistencia al cerrar y abrir']},
{id:3,title:'Consolidar avatar, equipamiento y tienda',date:'13–19 septiembre 2026',desc:'Tienda basada en personaje → colección → categoría.',detail:'El jugador podrá escoger libremente su primer personaje y ese personaje será gratuito. Si quiere un segundo personaje, deberá desbloquearlo pagando diamantes. Cada personaje tendrá su propio avatar maestro y equipamiento compatible.',tasks:['Definir modelo personaje → colección → categoría','Permitir escoger el personaje gratuito inicial','El personaje escogido por el jugador es el gratuito; no fijar uno obligatorio','Mantener el personaje masculino actual como opción','Crear personaje femenino y avatar maestro','Crear personaje animal y avatar maestro','Definir coste en diamantes del segundo personaje y siguientes','Desbloqueo de personajes con diamantes','Equipamiento y armaduras independientes por personaje','Paper-doll independiente para cada personaje','Definir tres colecciones por personaje','Navegación Avatar → Colección → Categoría','Filtrado por personaje y colección','Impedir piezas incompatibles con otro personaje','Inventario independiente por personaje','Persistir y sincronizar personaje, desbloqueos y equipamiento','Mostrar siempre el personaje seleccionado/equipado','Migrar catálogo actual sin perder compras ni progreso','Revisar precios, rarezas, niveles y economía de diamantes','Integrar únicamente assets gráficos aprobados y alineados','Adaptar pantalla principal y recompensas al personaje','Probar tienda en móvil y escritorio']},
{id:4,title:'Estabilizar y completar los juegos de acción',date:'20–26 septiembre 2026',desc:'Cerrar bugs y completar el juego de tanques y otros juegos de acción.',detail:'Resolver bloqueos y validar colisiones, bonus, obstáculos, rebotes, reinicios y controles.',tasks:['Corregir bloqueo al mover tanques','Corregir bloqueo al aparecer bonus','Validar obstáculos destructibles','Validar rebotes y salida de disparos','Validar bonus y pérdida por impacto','Validar reinicio y colisiones','Pruebas táctiles']},
{id:5,title:'Ampliar los juegos para cubrir varias edades',date:'27 septiembre–4 octubre 2026',desc:'Más niveles y progresión adecuada para distintos tramos de edad.',detail:'Cada juego tendrá más contenido y una progresión de dificultad coherente.',tasks:['Definir tramos de edad','Diseñar más niveles por juego','Aumentar dificultad progresivamente','Ajustar XP y recompensas','Validar recorridos por edad','Pruebas con usuarios']},
{id:6,title:'Adaptación automática según la edad',date:'5–11 octubre 2026',desc:'Adaptar inicialmente la dificultad según la edad del jugador.',detail:'La edad se utilizará para proponer una experiencia adecuada, con control familiar y sincronización.',tasks:['Solicitar edad','Definir rangos','Reglas de dificultad','Dificultad inicial automática','Ajuste desde Padres','Guardar y sincronizar configuración','Minimizar exposición de la edad']},
{id:7,title:'Cerrar experiencia educativa y progresión',date:'12–18 octubre 2026',desc:'Unificar juegos, niveles, XP, diamantes, recompensas y avatar.',detail:'Revisar el recorrido completo y la coherencia educativa y motivacional.',tasks:['Revisar pantalla principal','Revisar juegos y niveles','Revisar XP','Revisar diamantes','Revisar tienda','Validar experiencia educativa','Mantener rimas desactivado mientras corresponda']},
{id:8,title:'Identidad, nombre y preparación comercial',date:'19–25 octubre 2026',desc:'Cerrar nombre, identidad, dominio y presentación del producto.',detail:'Preparar identidad y materiales necesarios para presentar Ludeiko.',tasks:['Disponibilidad del nombre','Marca/nombre comercial','Dominio','Identidad visual','Iconos','Textos comerciales','Nomenclatura coherente']},
{id:9,title:'Cuenta real, correo transaccional y recuperación',date:'26 octubre–1 noviembre 2026',desc:'SMTP propio y correos de producción.',detail:'Sustituir las limitaciones del correo de prueba por correo transaccional preparado para producción.',tasks:['Seleccionar proveedor SMTP','Configurar dominio remitente','Autenticación del dominio','Integrar SMTP con Supabase','Registro y confirmación','Recuperación de contraseña','Cambio de correo','Enlaces de retorno','Entregabilidad y límites']},
{id:10,title:'Privacidad, condiciones y protección de menores',date:'2–8 noviembre 2026',desc:'Base legal y protección de datos para producto infantil.',detail:'Preparar privacidad, condiciones, consentimiento, cuentas familiares y minimización de datos.',tasks:['Política de privacidad','Condiciones','Tratamiento de datos de menores','Consentimientos','Minimización de datos','Almacenamiento','Analítica','Configuración familiar','Arquitectura de cuentas']},
{id:11,title:'Estadísticas, evolución y uso',date:'9–15 noviembre 2026',desc:'Medir evolución educativa y uso del producto antes de la beta.',detail:'Crear una base de métricas que permita a las familias entender la evolución del jugador y al proyecto conocer qué contenidos funcionan. Las métricas deberán diseñarse con privacidad y sin recoger datos innecesarios.',tasks:['Definir modelo de eventos y métricas','Registrar XP, niveles y progresión','Registrar aciertos, errores e intentos por juego','Registrar partidas, sesiones y tiempo de juego','Registrar niveles y juegos más utilizados','Registrar uso de tienda, personajes y diamantes','Crear gráficas de evolución para Padres','Crear estadísticas internas de uso del producto','Crear comparativas por periodos','Definir métricas de retención y recurrencia','Validar exactitud de los datos','Definir minimización y privacidad de las métricas','Probar rendimiento de la recogida de datos']},
{id:12,title:'Fase beta con cuentas gratuitas',date:'16–29 noviembre 2026',desc:'Probar el producto con usuarios reales.',detail:'Beta controlada para detectar errores, problemas de uso y oportunidades de mejora.',tasks:['Preparar cuentas beta','Definir grupo de usuarios','Probar altas','Probar juegos y progresión','Probar avatar y tienda','Probar estadísticas','Probar sincronización','Recoger incidencias','Recoger feedback','Priorizar correcciones']},
{id:13,title:'Prueba multiplataforma y compatibilidad',date:'30 noviembre–6 diciembre 2026',desc:'Validar móvil, tablet, escritorio y navegadores.',detail:'Prueba sistemática de dispositivos, orientación, táctil, teclado, sonido, carga y persistencia.',tasks:['iPhone','iPad','Safari','Chrome','Firefox','Edge','Vertical/horizontal','Táctil','Teclado','Sonido','Rendimiento','Sesiones','Cambio de dispositivo']},
{id:14,title:'Pulido final, rendimiento y seguridad',date:'7–13 diciembre 2026',desc:'Auditoría técnica final.',detail:'Revisar estructura, rutas, recursos, versiones, sincronización, consola, rendimiento y seguridad.',tasks:['Auditar estructura','Comprobar rutas','Comprobar recursos','Revisar almacenamiento/sync','Revisar consola','Optimizar imágenes','Optimizar carga','Revisar seguridad','Eliminar pruebas','Eliminar duplicados']},
{id:15,title:'Preparar lanzamiento y marketing',date:'14–20 diciembre 2026',desc:'Preparar presentación, materiales y estrategia de lanzamiento.',detail:'Definir propuesta de valor, público, capturas, demostraciones, web y materiales de comunicación.',tasks:['Propuesta de valor','Público objetivo','Capturas/demos','Página de presentación','Materiales sociales','Estrategia','Contenido inicial','Instrucciones para familias']},
{id:16,title:'Prelanzamiento y prueba final de producción',date:'21–27 diciembre 2026',desc:'Repetir todo el flujo en condiciones de producción.',detail:'Última prueba de aceptación antes de publicar.',tasks:['Cuenta real','Correo real','Selección de personaje','Edad','Juegos','Progresión','Avatar/tienda','Estadísticas','Sincronización','Recuperación']},
{id:17,title:'Versión comercializable',date:'28–31 diciembre 2026',desc:'Publicar la versión estable preparada para comercialización.',detail:'Cerrar y publicar la versión estable, documentando el procedimiento de actualización.',tasks:['Cerrar versión estable','Verificar producción','Etiquetar release','Documentar actualización','Publicar','Comprobación postpublicación']},
{id:18,title:'Seguimiento después del lanzamiento',date:'Desde enero 2027',desc:'Medir, corregir y evolucionar el producto.',detail:'Monitorizar incidencias, uso y feedback y planificar nuevas versiones sin perder estabilidad.',tasks:['Monitorizar incidencias','Revisar estadísticas','Revisar feedback','Analizar rendimiento','Priorizar mejoras','Planificar versiones','Control de regresiones']}
];
const storageKey='ludeiko-roadmap-subtasks-v5';let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}let selected=3;
const sheet=document.getElementById('sheet'),list=document.getElementById('stageList'),details=document.getElementById('details'),backdrop=document.getElementById('backdrop');
function taskState(stage){return saved[stage.id]||{}}
function completed(stage){const state=taskState(stage);return stage.tasks.reduce((n,_,i)=>n+(state[i]?1:0),0)}
function renderList(){list.innerHTML=stages.map(s=>`<article class="stage ${s.done?'done ':''}${s.late?'late ':''}${s.id===selected?'selected':''}"><button type="button" data-id="${s.id}" aria-current="${s.id===selected?'true':'false'}"><span class="stage-title">${s.title}${s.done?'<span class="status">CERRADA</span>':''}</span><span class="stage-date">${s.date}</span><span class="stage-desc">${s.desc}</span></button></article>`).join('');document.getElementById('stageCount').textContent=stages.length;document.getElementById('doneCount').textContent=stages.filter(s=>s.done).length}
function renderDetails(){const s=stages.find(x=>x.id===selected)||stages[0],state=taskState(s),done=completed(s),total=s.tasks.length,pct=total?Math.round(done/total*100):0;const prev=stages.findIndex(x=>x.id===s.id)-1,next=prev+2;details.innerHTML=`<div class="stage-head"><div><div class="kicker">Etapa ${s.id} de ${stages.length}${s.done?' · CERRADA':''}</div><h2>${s.title}</h2><div class="stage-date">${s.date}</div><p class="stage-description">${s.detail}</p></div><div class="stage-state"><strong>${pct}%</strong><span>completado</span></div></div><div class="progress-wrap"><div class="progress-meta"><span>${done} de ${total} tareas completadas</span><span>${pct}%</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div><p class="hint">Completa aquí los elementos necesarios para cerrar esta etapa. El progreso se guarda en este dispositivo.</p><ul class="task-list">${s.tasks.map((t,i)=>`<li class="task"><input type="checkbox" id="task-${s.id}-${i}" data-stage="${s.id}" data-task="${i}" ${state[i]?'checked':''}><label for="task-${s.id}-${i}">${t}</label></li>`).join('')}</ul><div class="actions"><button class="nav-btn" type="button" data-nav="${prev>=0?stages[prev].id:''}" ${prev<0?'disabled':''}>← Anterior</button><button class="nav-btn primary" type="button" data-nav="${next<stages.length?stages[next].id:''}" ${next>=stages.length?'disabled':''}>Siguiente →</button></div>`}
function selectStage(id){selected=Number(id);renderList();renderDetails();closeMenu();window.scrollTo({top:0,behavior:'smooth'})}
function openMenu(){sheet.classList.remove('closed');backdrop.classList.add('visible');document.getElementById('openMenu').setAttribute('aria-expanded','true')}
function closeMenu(){sheet.classList.add('closed');backdrop.classList.remove('visible');document.getElementById('openMenu').setAttribute('aria-expanded','false')}
list.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)selectStage(b.dataset.id)});
details.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b&&b.dataset.nav)selectStage(b.dataset.nav)});
details.addEventListener('change',e=>{if(!e.target.matches('input[data-stage]'))return;const s=e.target.dataset.stage,t=e.target.dataset.task;saved[s]=saved[s]||{};saved[s][t]=e.target.checked;try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(err){}renderDetails()});
document.getElementById('openMenu').addEventListener('click',openMenu);document.getElementById('closeMenu').addEventListener('click',closeMenu);document.getElementById('sheetTab').addEventListener('click',openMenu);backdrop.addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
renderList();renderDetails();closeMenu();
</script>
</body>
</html>
