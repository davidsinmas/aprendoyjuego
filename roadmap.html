<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315c50">
<title>Planning · Ludeiko</title>
<style>
:root{--bg:#eef3f0;--paper:#fff;--paper2:#f7faf8;--text:#24312d;--muted:#68746f;--line:#d7dfdb;--accent:#315c50;--done:#718078;--tab:56px;--sheet:min(430px,92vw)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;overflow:hidden}.topbar{min-height:82px;padding:16px max(20px,calc((100vw - 1240px)/2));display:flex;align-items:center;background:#ffffffee;border-bottom:1px solid var(--line);position:relative;z-index:2}.brand h1{margin:0;font-size:clamp(1.45rem,3vw,2rem);letter-spacing:-.035em}.brand p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.workspace{width:min(1160px,calc(100% - 36px));margin:auto;padding:28px 0 52px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:26px;min-height:calc(100vh - 165px);padding:clamp(24px,4vw,38px);box-shadow:0 10px 32px #24312d10;position:relative}.paper:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:26px 26px 0 0;background:linear-gradient(90deg,var(--accent),#7da69a,var(--accent))}
.welcome{max-width:780px;margin:5vh auto;text-align:center}.welcome .kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:850}.welcome h2{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.08;letter-spacing:-.04em;margin:10px 0}.welcome p{color:var(--muted);line-height:1.65}.welcome button{margin-top:14px;border:0;background:var(--accent);color:#fff;border-radius:13px;padding:12px 18px;font-weight:800}
.stage-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px}.kicker{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:850}.stage-head h2{margin:7px 0 6px;font-size:clamp(1.55rem,4vw,2.2rem);line-height:1.08;letter-spacing:-.035em}.date{color:var(--muted);font-size:.9rem}.description{margin:15px 0 0;color:#4d5a55;line-height:1.6;max-width:820px}.score{align-self:start;min-width:100px;text-align:center;border:1px solid var(--line);background:var(--paper2);border-radius:15px;padding:12px}.score strong{display:block;font-size:1.25rem}.score span{font-size:.67rem;color:var(--muted);font-weight:850;letter-spacing:.08em;text-transform:uppercase}
.progress{margin:22px 0}.progress-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:7px}.bar{height:8px;background:#e3eae6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.tasks{display:grid;grid-template-columns:1fr;gap:10px;list-style:none;padding:0;margin:0}.task{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--paper2);min-width:0}.task input{appearance:none;flex:0 0 21px;width:21px;height:21px;margin:0;border:2px solid #9aaba4;border-radius:6px;background:#fff;position:relative}.task input:checked{background:var(--accent);border-color:var(--accent)}.task input:checked:after{content:"";position:absolute;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);left:6px;top:3px}.task label{font-size:.93rem;line-height:1.48;overflow-wrap:anywhere;cursor:pointer}.task input:checked+label{text-decoration:line-through;color:var(--done)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.nav{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 15px;font-weight:750}.nav.primary{background:var(--accent);border-color:var(--accent);color:#fff}.nav:disabled{opacity:.4;cursor:not-allowed}
.sheet{position:fixed;z-index:20;left:0;top:0;width:var(--sheet);height:100dvh;padding:16px 14px 16px 18px;transform:translateX(0);transition:transform .72s cubic-bezier(.22,.8,.2,1);filter:drop-shadow(15px 0 30px #15231e20)}.sheet.collapsed{transform:translateX(calc(-1 * (var(--sheet) - var(--tab))))}.sheet-inner{height:100%;background:linear-gradient(145deg,#fff,#f5f8f6);border:1px solid #cfdad5;border-radius:0 25px 25px 0;display:flex;flex-direction:column;overflow:hidden}.sheet-head{padding:21px 20px 16px;border-bottom:1px solid var(--line)}.sheet-head h2{margin:0;font-size:1.1rem}.sheet-head p{margin:5px 0 0;color:var(--muted);font-size:.78rem;line-height:1.4}.summary{padding:12px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px}.summary strong{display:block;font-size:1rem}.summary span{font-size:.67rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.stage-list{overflow:auto;flex:1;padding:14px 12px 18px;display:grid;gap:8px;overscroll-behavior:contain}.stage{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;transition:.2s}.stage:hover{border-color:#aebfb8;transform:translateX(2px)}.stage.selected{border-color:var(--accent);box-shadow:0 5px 17px #315c5020;transform:translateX(5px)}.stage button{width:100%;border:0;background:transparent;text-align:left;color:inherit;padding:13px}.title{display:block;font-weight:800;font-size:.84rem;line-height:1.3}.small-date{display:block;margin-top:4px;color:var(--muted);font-size:.72rem}.desc{display:block;margin-top:5px;color:#596660;font-size:.72rem;line-height:1.35}.closed{display:inline-block;margin-left:6px;color:var(--done);font-size:.59rem;font-weight:900}.stage.done .title,.stage.done .small-date,.stage.done .desc{text-decoration:line-through;color:var(--done)}
.tab{position:absolute;right:calc(-1 * var(--tab));top:50%;transform:translateY(-50%);width:var(--tab);min-height:118px;border:1px solid #c7d4ce;border-left:0;border-radius:0 16px 16px 0;background:#f7faf8;color:var(--accent);box-shadow:9px 7px 22px #24312d18;writing-mode:vertical-rl;font-weight:850;letter-spacing:.05em}.tab span{font-size:.7rem}.mobile-menu{display:none}
@media(max-width:820px){.topbar{min-height:70px;padding:13px 16px}.brand p{display:none}.mobile-menu{display:block;margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:9px 12px;font-weight:800}.workspace{width:calc(100% - 18px);padding:14px 0 30px}.paper{border-radius:20px;min-height:calc(100vh - 100px);padding:20px}.paper:before{border-radius:20px 20px 0 0}.sheet{--sheet:min(410px,91vw);padding:9px 9px 9px 0}.sheet-inner{border-radius:0 20px 20px 0}.stage-head{grid-template-columns:1fr}.score{justify-self:start}.actions{position:sticky;bottom:8px;padding:8px;border:1px solid var(--line);border-radius:13px;background:#fffffff2;backdrop-filter:blur(8px)}}
@media(max-width:520px){.paper{padding:17px}.stage-head h2{font-size:1.48rem}.task{padding:13px}.sheet-head{padding:18px 16px 14px}.summary{padding:11px 16px}.stage-list{padding:12px 9px 16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><h1>Planning de Ludeiko</h1><p>Una hoja de trabajo. Selecciona una etapa para desplegarla.</p></div><button class="mobile-menu" id="mobileMenu" type="button">Etapas</button></header>
<main class="workspace"><section class="paper" id="content"></section></main>
<aside class="sheet" id="sheet" aria-label="Menú de etapas"><div class="sheet-inner"><div class="sheet-head"><h2>Mapa de etapas</h2><p>Selecciona una etapa. La hoja superior se recogerá hacia la izquierda para descubrir su contenido.</p></div><div class="summary"><div><strong id="count">18</strong><span>Etapas</span></div><div><strong id="doneCount">2</strong><span>Cerradas</span></div></div><nav class="stage-list" id="stageList"></nav></div><button class="tab" id="tab" type="button" aria-label="Mostrar menú de etapas"><span>ETAPAS</span></button></aside>
<script>
const stages=[
{id:1,title:'Cerrar y estabilizar el acceso de familias',date:'5–7 septiembre 2026',done:true,desc:'Registro, confirmación, acceso y modo Padres.',detail:'Registro, confirmación, inicio de sesión y modo Padres. Safari y el PIN están validados. SMTP externo queda aplazado.',tasks:['Registro de familias','Confirmación y retorno correcto desde el correo','Inicio y cierre de sesión','Modo Padres','Teclado/PIN en Safari','SMTP externo aplazado a etapa 9']},
{id:2,title:'Consolidar la sincronización entre dispositivos',date:'8–12 septiembre 2026',done:true,desc:'Progreso y cambios online/offline entre dispositivos.',detail:'La sincronización se ha validado con la misma cuenta en dos dispositivos, incluyendo recuperación tras trabajar sin conexión.',tasks:['Misma cuenta en dos dispositivos','Mismo progreso en ambos','Cambio en A visible en B','Cambio offline sincronizado al recuperar internet','Persistencia al cerrar y abrir']},
{id:3,title:'Consolidar avatar, equipamiento y tienda',date:'13–19 septiembre 2026',desc:'Tienda basada en personaje → colección → categoría.',detail:'El jugador podrá escoger libremente su primer personaje y ese personaje será gratuito. Si quiere un segundo personaje, deberá desbloquearlo pagando diamantes. Cada personaje tendrá su propio avatar maestro y equipamiento compatible.',tasks:['Definir modelo personaje → colección → categoría','Permitir escoger el personaje gratuito inicial','El personaje escogido por el jugador es el gratuito; no fijar uno obligatorio','Mantener el personaje masculino actual como opción','Crear personaje femenino y avatar maestro','Crear personaje animal y avatar maestro','Definir coste en diamantes del segundo personaje y siguientes','Desbloqueo de personajes con diamantes','Equipamiento y armaduras independientes por personaje','Paper-doll independiente para cada personaje','Definir tres colecciones por personaje','Navegación Avatar → Colección → Categoría','Filtrado por personaje y colección','Impedir piezas incompatibles con otro personaje','Inventario independiente por personaje','Persistir y sincronizar personaje, desbloqueos y equipamiento','Mostrar siempre el personaje seleccionado/equipado','Migrar catálogo actual sin perder compras ni progreso','Revisar precios, rarezas, niveles y economía de diamantes','Integrar únicamente assets gráficos aprobados y alineados','Adaptar pantalla principal y recompensas al personaje','Probar tienda en móvil y escritorio']},
{id:4,title:'Estabilizar y completar los juegos de acción',date:'20–26 septiembre 2026',desc:'Cerrar bugs y completar el juego de tanques y otros juegos de acción.',detail:'Resolver bloqueos y validar colisiones, bonus, obstáculos, rebotes, reinicios y controles.',tasks:['Corregir bloqueo al mover tanques','Corregir bloqueo al aparecer bonus','Validar obstáculos destructibles','Validar rebotes y salida de disparos','Validar bonus y pérdida por impacto','Validar reinicio y colisiones','Pruebas táctiles']},
{id:5,title:'Ampliar los juegos para cubrir varias edades',date:'27 septiembre–4 octubre 2026',desc:'Más niveles y progresión adecuada para distintos tramos de edad.',detail:'Cada juego tendrá más contenido y una progresión de dificultad coherente.',tasks:['Definir tramos de edad','Diseñar más niveles por juego','Aumentar dificultad progresivamente','Ajustar XP y recompensas','Validar recorridos por edad','Pruebas con usuarios']},
{id:6,title:'Adaptación automática según la edad',date:'5–11 octubre 2026',desc:'Adaptar inicialmente la dificultad según la edad del jugador.',detail:'La edad se utilizará para proponer una experiencia adecuada, con control familiar y sincronización.',tasks:['Solicitar edad','Definir rangos','Reglas de dificultad','Dificultad inicial automática','Ajuste desde Padres','Guardar y sincronizar configuración','Minimizar exposición de la edad']},
{id:7,title:'Cerrar experiencia educativa y progresión',date:'12–18 octubre 2026',desc:'Unificar juegos, niveles, XP, diamantes, recompensas y avatar.',detail:'Revisar el recorrido completo y la coherencia educativa y motivacional.',tasks:['Revisar pantalla principal','Revisar juegos y niveles','Revisar XP','Revisar diamantes','Revisar tienda','Validar experiencia educativa','Mantener rimas desactivado mientras corresponda']},
{id:8,title:'Identidad, nombre y preparación comercial',date:'19–25 octubre 2026',desc:'Cerrar nombre, identidad, dominio y presentación del producto.',detail:'Preparar identidad y materiales necesarios para presentar Ludeiko.',tasks:['Disponibilidad del nombre','Marca/nombre comercial','Dominio','Identidad visual','Iconos','Textos comerciales','Nomenclatura coherente']},
{id:9,title:'Cuenta real, correo transaccional y recuperación',date:'26 octubre–1 noviembre 2026',desc:'SMTP propio y correos de producción.',detail:'Sustituir las limitaciones del correo de prueba por correo transaccional preparado para producción.',tasks:['Seleccionar proveedor SMTP','Configurar dominio remitente','Autenticación del dominio','Integrar SMTP con Supabase','Registro y confirmación','Recuperación de contraseña','Cambio de correo','Enlaces de retorno','Entregabilidad y límites']},
{id:10,title:'Privacidad, condiciones y protección de menores',date:'2–8 noviembre 2026',desc:'Base legal y protección de datos para producto infantil.',detail:'Preparar privacidad, condiciones, consentimiento, cuentas familiares y minimización de datos.',tasks:['Política de privacidad','Condiciones','Tratamiento de datos de menores','Consentimientos','Minimización de datos','Almacenamiento','Analítica','Configuración familiar','Arquitectura de cuentas']},
{id:11,title:'Estadísticas, evolución y uso',date:'9–15 noviembre 2026',desc:'Medir evolución educativa y uso del producto antes de la beta.',detail:'Crear una base de métricas que permita a las familias entender la evolución del jugador y al proyecto conocer qué contenidos funcionan. Las métricas deberán diseñarse con privacidad y sin recoger datos innecesarios.',tasks:['Definir modelo de eventos y métricas','Registrar XP, niveles y progresión','Registrar aciertos, errores e intentos por juego','Registrar partidas, sesiones y tiempo de juego','Registrar niveles y juegos más utilizados','Registrar uso de tienda, personajes y diamantes','Crear gráficas de evolución para Padres','Crear estadísticas internas de uso del producto','Crear comparativas por periodos','Definir métricas de retención y recurrencia','Validar exactitud de los datos','Definir minimización y privacidad de las métricas','Probar rendimiento de la recogida de datos']},
{id:12,title:'Fase beta con cuentas gratuitas',date:'16–29 noviembre 2026',desc:'Probar el producto con usuarios reales.',detail:'Beta controlada para detectar errores, problemas de uso y oportunidades de mejora.',tasks:['Preparar cuentas beta','Definir grupo de usuarios','Probar altas','Probar juegos y progresión','Probar avatar y tienda','Probar estadísticas','Probar sincronización','Recoger incidencias','Recoger feedback','Priorizar correcciones']},
{id:13,title:'Prueba multiplataforma y compatibilidad',date:'30 noviembre–6 diciembre 2026',desc:'Validar móvil, tablet, escritorio y navegadores.',detail:'Prueba sistemática de dispositivos, orientación, táctil, teclado, sonido, carga y persistencia.',tasks:['iPhone','iPad','Safari','Chrome','Firefox','Edge','Vertical/horizontal','Táctil','Teclado','Sonido','Rendimiento','Sesiones','Cambio de dispositivo']},
{id:14,title:'Pulido final, rendimiento y seguridad',date:'7–13 diciembre 2026',desc:'Auditoría técnica final.',detail:'Revisar estructura, rutas, recursos, versiones, sincronización, consola, rendimiento y seguridad.',tasks:['Auditar estructura','Comprobar rutas','Comprobar recursos','Revisar almacenamiento/sync','Revisar consola','Optimizar imágenes','Optimizar carga','Revisar seguridad','Eliminar pruebas','Eliminar duplicados']},
{id:15,title:'Preparar lanzamiento y marketing',date:'14–20 diciembre 2026',desc:'Preparar presentación, materiales y estrategia de lanzamiento.',detail:'Definir propuesta de valor, público, capturas, demostraciones, web y materiales de comunicación.',tasks:['Propuesta de valor','Público objetivo','Capturas/demos','Página de presentación','Materiales sociales','Estrategia','Contenido inicial','Instrucciones para familias']},
{id:16,title:'Prelanzamiento y prueba final de producción',date:'21–27 diciembre 2026',desc:'Repetir todo el flujo en condiciones de producción.',detail:'Última prueba de aceptación antes de publicar.',tasks:['Cuenta real','Correo real','Selección de personaje','Edad','Juegos','Progresión','Avatar/tienda','Estadísticas','Sincronización','Recuperación']},
{id:17,title:'Versión comercializable',date:'28–31 diciembre 2026',desc:'Publicar la versión estable preparada para comercialización.',detail:'Cerrar y publicar la versión estable, documentando el procedimiento de actualización.',tasks:['Cerrar versión estable','Verificar producción','Etiquetar release','Documentar actualización','Publicar','Comprobación postpublicación']},
{id:18,title:'Seguimiento después del lanzamiento',date:'Desde enero 2027',desc:'Medir, corregir y evolucionar el producto.',detail:'Monitorizar incidencias, uso y feedback y planificar nuevas versiones sin perder estabilidad.',tasks:['Monitorizar incidencias','Revisar estadísticas','Revisar feedback','Analizar rendimiento','Priorizar mejoras','Planificar versiones','Control de regresiones']}
];
const key='ludeiko-roadmap-subtasks-v6';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let selected=null;
const sheet=document.getElementById('sheet'),list=document.getElementById('stageList'),content=document.getElementById('content');
function state(s){return saved[s.id]||{}}function done(s){const x=state(s);return s.tasks.reduce((n,_,i)=>n+(x[i]?1:0),0)}
function renderList(){list.innerHTML=stages.map(s=>`<article class="stage ${s.done?'done ':''}${s.id===selected?'selected':''}"><button data-id="${s.id}" type="button"><span class="title">${s.title}${s.done?'<span class="closed">CERRADA</span>':''}</span><span class="small-date">${s.date}</span><span class="desc">${s.desc}</span></button></article>`).join('');document.getElementById('count').textContent=stages.length;document.getElementById('doneCount').textContent=stages.filter(s=>s.done).length}
function renderContent(){if(selected===null){content.innerHTML='<div class="welcome"><div class="kicker">Planning de proyecto</div><h2>Una sola hoja para empezar</h2><p>Selecciona una etapa en la hoja superior. Al hacerlo, esa hoja se desplazará hacia la izquierda y quedará recogida, dejando visible todo el contenido necesario para trabajar en la etapa.</p><button type="button" id="choose">Ver etapas</button></div>';return}const s=stages.find(x=>x.id===selected),d=done(s),total=s.tasks.length,p=Math.round(d/total*100),idx=stages.findIndex(x=>x.id===s.id);content.innerHTML=`<div class="stage-head"><div><div class="kicker">Etapa ${s.id} de ${stages.length}${s.done?' · CERRADA':''}</div><h2>${s.title}</h2><div class="date">${s.date}</div><p class="description">${s.detail}</p></div><div class="score"><strong>${p}%</strong><span>completado</span></div></div><div class="progress"><div class="progress-meta"><span>${d} de ${total} tareas completadas</span><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div><ul class="tasks">${s.tasks.map((t,i)=>`<li class="task"><input id="t-${s.id}-${i}" type="checkbox" data-stage="${s.id}" data-task="${i}" ${state(s)[i]?'checked':''}><label for="t-${s.id}-${i}">${t}</label></li>`).join('')}</ul><div class="actions"><button class="nav" data-nav="${idx>0?stages[idx-1].id:''}" ${idx===0?'disabled':''}>← Anterior</button><button class="nav primary" data-nav="${idx<stages.length-1?stages[idx+1].id:''}" ${idx===stages.length-1?'disabled':''}>Siguiente →</button></div>`}
function selectStage(id){selected=Number(id);renderList();renderContent();requestAnimationFrame(()=>sheet.classList.add('collapsed'));window.scrollTo({top:0,behavior:'smooth'})}
function openMenu(){sheet.classList.remove('collapsed')}
list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)selectStage(b.dataset.id)});content.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav&&nav.dataset.nav)selectStage(nav.dataset.nav);if(e.target.id==='choose')openMenu()});content.addEventListener('change',e=>{if(!e.target.matches('[data-stage]'))return;const s=e.target.dataset.stage,t=e.target.dataset.task;saved[s]=saved[s]||{};saved[s][t]=e.target.checked;try{localStorage.setItem(key,JSON.stringify(saved))}catch(err){}renderContent();});document.getElementById('tab').addEventListener('click',openMenu);document.getElementById('mobileMenu').addEventListener('click',openMenu);
renderList();renderContent();
</script>
</body>
</html>
